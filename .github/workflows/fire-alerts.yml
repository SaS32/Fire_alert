name: Fire Alerts

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "check = alert on new fires only, report = full status of last 24h"
        type: choice
        default: check
        options:
          - check
          - report

permissions:
  contents: write

jobs:
  check-fires:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pillow

      - name: Run fire check
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FIRE_COUNTRY: "BGR"
          FIRE_BBOX: "22.3,41.2,28.7,44.3"
          FIRE_MIN_CONFIDENCE: "nominal"
          # Distances in every alert are measured from here, nearest fire first.
          # Change these three lines to move the reference point.
          FIRE_CENTER_NAME: "Sofia"
          FIRE_CENTER_LAT: "42.6977"
          FIRE_CENTER_LON: "23.3219"
          # Alert times are shown in this zone, with UTC in brackets.
          FIRE_TIMEZONE: "Europe/Sofia"
          RUN_MODE: ${{ inputs.mode || 'check' }}
        run: python fire_alerts_action.py

      - name: Save seen detections
        run: |
          git config user.name "fire-alert-bot"
          git config user.email "actions@github.com"
          git add seen_fires.json || true
          git add alert_cooldown.json || true
          git diff --cached --quiet || git commit -m "Update seen fires [skip ci]"
          git push
