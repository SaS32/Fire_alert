[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fire-alert"
version = "1.0.0"
description = "Satellite wildfire notifications via NASA FIRMS and Telegram, plus a recurring-hotspot finder"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "SaS32"}]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
photos = ["pillow>=9"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
fire-alerts = "fire_alerts_action:main"
find-hotspots = "find_hotspots:main"

[tool.setuptools]
py-modules = ["fire_alerts_action", "find_hotspots", "geo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 99

[tool.ruff.lint]
select = ["F", "E9"]